[project]
name = "vibe-bridge"
version = "0.1.0"
description = "Pont Telegram <-> vibe-acp : Agent Client Protocol (JSON-RPC stdio) vers un bot Telegram mono-utilisateur"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=22.7",
]

[project.scripts]
vibe-bridge = "vibe_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibe_bridge"]
